name: Keeper Cron

# CADENCE — read before touching the schedule.
#
# Measured 2026-07-28: the old "*/45 * * * *" was landing runs ~134 min apart on average
# (up to 250), while the site claims "~hourly". Two causes:
#   1. */45 fires at :00 and :45. Minute :00 is the single most contended slot on GitHub's
#      shared scheduler, so those ticks get deprioritised and skipped the most.
#   2. It is also unevenly spaced (45 then 15).
#
# Fix: same frequency (2x/hour) but on low-contention, evenly-spaced minutes (:09 and :39).
# This raises the fraction of scheduled ticks that actually run without raising the count —
# important because this is a PRIVATE repo capped at 2000 Actions-min/month. Scheduling more
# often would risk exceeding the cap and DISABLING the keeper entirely, which is far worse
# than slow cadence. Do not increase frequency without checking the minutes budget.
#
# GitHub cron is best-effort and can never be guaranteed. If reliable hourly is ever needed,
# drive workflow_dispatch from an external pinger (e.g. cron-job.org) instead of the schedule.
on:
  schedule:
    - cron: "9,39 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run-keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: keeper/package-lock.json

      - name: Install dependencies
        working-directory: keeper
        run: npm ci

      - name: Write keeper keypair
        working-directory: keeper
        run: echo "$KEEPER_KEYPAIR_JSON" > keeper.json
        env:
          KEEPER_KEYPAIR_JSON: ${{ secrets.KEEPER_KEYPAIR_JSON }}

      - name: Run single keeper cycle
        working-directory: keeper
        run: npx ts-node src/run_once.ts
        env:
          RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          KEEPER_KEYPAIR_PATH: ./keeper.json
          PROGRAM_ID: 3tAEmHXZ51YVLe9ts8b9cMcgQPgaSamLxLtxR31VpREi
          VAULT_ADDRESSES: 5XpzWiE8jb53CShYv19UoXcY2AywjeXpfwCff8mgrNYn,7MJGAiZmTre6VmVQXgYRK6vqoQeoMW1jwEL9jEXZgRy3
          IDL_PATH: idl/yieldpilot.mainnet.json
          KAMINO_API_URL: https://api.kamino.finance
          MARINADE_API_URL: https://api.marinade.finance
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERTS_CHANNEL_ID: -1004486893356

      - name: Clean up keeper keypair
        if: always()
        working-directory: keeper
        run: rm -f keeper.json

      # Persists the last-processed signature per vault for the deposit watcher (see
      # depositWatcher.ts) so consecutive runs never re-announce the same deposit,
      # and never miss one either. Same auto-commit pattern build.yml already uses
      # for IDL syncing — no new secret/Redis dependency needed.
      - name: Commit deposit-watch state
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update deposit-watch state [skip ci]"
          file_pattern: "keeper/state/deposit-watch.json"
