name: Keeper Cron

# CADENCE — read before touching this.
#
# There is NO native `schedule:` trigger here on purpose. GitHub Actions' own scheduler is
# fundamentally best-effort and was measured (2026-07-28, then again 2026-08-03) landing runs
# 90-220 min apart on a nominal 30-min cadence, regardless of which minutes it was pointed at
# (tried both contended :00/:45 and low-contention :09/:39 — neither materially helped). It can
# silently drop scheduled ticks, especially on a low-activity private repo, with no way to
# detect or retry from inside the workflow itself.
#
# Fix (2026-08-03): an external pinger (cron-job.org, free) calls this workflow's
# `workflow_dispatch` REST endpoint every 30 minutes. That's still the PRIMARY cadence —
# a native `schedule:` firing every 30m alongside it would double every invocation for
# zero benefit, exactly as the reasoning above always said.
#
# ADDED 2026-09-03: a single low-frequency native `schedule:` tick, purely as a dead-
# pinger backstop — not a cadence driver. If cron-job.org is the keeper's ONLY trigger
# and it dies silently, the keeper stops entirely with no automatic recovery (this was a
# real, named gap, not hypothetical). At 3 hours this barely overlaps a healthy 30m
# pinger (one native tick lands sometime within each 3h window a normal pinger already
# covered ~6 times over) and costs a small, bounded number of extra Actions-minutes
# against the 2000/month private-repo cap — the tradeoff is worth it specifically because
# the alternative is a total, silent stop with no fallback until keeper-cadence-check
# alerts (up to an hour later) AND someone acts on it.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "7 */3 * * *"
permissions:
  contents: write
jobs:
  run-keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: keeper/package-lock.json

      - name: Install dependencies
        working-directory: keeper
        run: npm ci

      # WAS `npx ts-node src/run_once.ts` — ts-node re-transpiles the entire keeper source
      # tree from scratch on EVERY single cron tick (every ~30 min, forever), paying that
      # cost repeatedly for code that only actually changes on a push. A one-time `tsc`
      # build + running the plain compiled JS is the same output, done once per run instead
      # of the transpile-on-every-invocation tax ts-node adds on top of that.
      - name: Build keeper
        working-directory: keeper
        run: |
          npm run build
          # `tsc` only compiles .ts -> .js; it does NOT copy non-TS assets. IDL_PATH is
          # resolved via `path.resolve(__dirname, ...)` in solanaClient.ts, which points
          # at dist/ once running compiled code (it pointed at src/ under ts-node, which
          # is why this didn't show up until the ts-node -> build switch). Without this
          # copy, every run failed ENOENT on dist/idl/yieldpilot.mainnet.json — confirmed
          # live 2026-09-03: this broke the keeper for ~12 hours across ~24 runs before
          # being caught, entirely from this one missing copy step.
          mkdir -p dist/idl
          cp src/idl/*.json dist/idl/

      - name: Write keeper keypair
        working-directory: keeper
        run: echo "$KEEPER_KEYPAIR_JSON" > keeper.json
        env:
          KEEPER_KEYPAIR_JSON: ${{ secrets.KEEPER_KEYPAIR_JSON }}

      - name: Run single keeper cycle
        id: run_cycle
        working-directory: keeper
        run: node dist/run_once.js
        env:
          RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          KEEPER_KEYPAIR_PATH: ./keeper.json
          PROGRAM_ID: 3tAEmHXZ51YVLe9ts8b9cMcgQPgaSamLxLtxR31VpREi
          VAULT_ADDRESSES: 5XpzWiE8jb53CShYv19UoXcY2AywjeXpfwCff8mgrNYn,7MJGAiZmTre6VmVQXgYRK6vqoQeoMW1jwEL9jEXZgRy3
          # LP vaults (Orca + Raydium SOL/USDC) — was unset entirely until 2026-09-01,
          # meaning fetchAllLpVaults() always returned empty and the keeper's LP-fee-
          # collection wiring (collectLpFees, added the same day set_lp_keeper fixed
          # this vault's keeper field) never actually ran despite being fully built and
          # tested. Orca vault is currently empty (0 shares) but the keeper is now
          # ready the moment it's funded again. Raydium fee collection isn't wired yet
          # (collectLpFees explicitly skips Raydium with a log line) — listing it here
          # is harmless and future-proofs this line for when it is.
          LP_VAULT_ADDRESSES: FhuthBKSw2TWZRrzxGFm3fcetuDsPLxFhqfM6KdcSyax,7eMRVqgNFt8qMUBPFbycyCPYaKUdx7BKGW1GyxsXSoZP
          IDL_PATH: idl/yieldpilot.mainnet.json
          KAMINO_API_URL: https://api.kamino.finance
          MARINADE_API_URL: https://api.marinade.finance
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERTS_CHANNEL_ID: -1004486893356

      - name: Clean up keeper keypair
        if: always()
        working-directory: keeper
        run: rm -f keeper.json

      # Persists the last-processed signature per vault for the deposit watcher (see
      # depositWatcher.ts) so consecutive runs never re-announce the same deposit,
      # and never miss one either. Same auto-commit pattern build.yml already uses
      # for IDL syncing — no new secret/Redis dependency needed.
      #
      # WAS `if: always()` — committed whatever the state files looked like even after
      # a FAILED cycle (a thrown exception mid-run, an RPC outage, etc.), which can
      # persist a half-written or inconsistent state file as if it were a normal
      # checkpoint. Gated on the run step's own outcome now: a failed cycle's state
      # changes (if any were even written) are simply left uncommitted for the next
      # run to reconcile naturally, rather than baked in as truth.
      - name: Commit deposit-watch + epoch-entry state
        if: steps.run_cycle.outcome == 'success'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update keeper state [skip ci]"
          file_pattern: "keeper/state/deposit-watch.json keeper/state/epoch-entries.json"
