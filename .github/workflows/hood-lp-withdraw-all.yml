name: Hood LP Vault Withdraw All

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm this runs a REAL signed mainnet withdrawal'
        required: true
        default: 'no'

jobs:
  run-real-withdraw-all:
    if: github.event.inputs.confirm == 'yes'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hood-chain/lp
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies + build + withdraw (one step, real mainnet tx)
        env:
          HOOD_ADMIN_KEY: ${{ secrets.HOOD_ADMIN_KEY }}
        run: |
          forge install foundry-rs/forge-std@7fdf81f9ceb2f6ebbb8f9f1c6c5274d5bcc9a1f5 --no-commit
          forge install OpenZeppelin/openzeppelin-contracts@32608b2a5168a2c6ac691c5967356a2994aa2165 --no-commit
          forge install Uniswap/v4-core@46c6834698c48bc4a463a86d8420f4eb1d7f3b75 --no-commit
          forge build
          forge script script/RealWithdrawAllLpVault.s.sol             --rpc-url https://rpc.mainnet.chain.robinhood.com             --private-key "$HOOD_ADMIN_KEY"             --broadcast
