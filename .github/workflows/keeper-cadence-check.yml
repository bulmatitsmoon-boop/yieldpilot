name: Keeper Cadence Check

# Self-hosted watchdog: measures how often the keeper ACTUALLY runs and alerts Telegram on
# drift OR total silence. Runs on GitHub, needs no laptop or app open. Quiet when healthy.
#
# WAS once a day — that meant a total keeper outage (e.g. the cron-job.org pinger dying)
# could go undetected for up to ~24h, on top of the script itself never having checked for
# "nothing has run recently" in the first place (fixed 2026-09-02 — see the .mjs script's
# own comments for that half of the story). Bumped to hourly here as the other half of the
# fix: a watchdog that only checks once a day defeats the point of alerting fast.
#
# STILL RELIES on GitHub's native `schedule:` trigger, which this repo's own keeper-cron.yml
# documents as unreliable under load (best-effort, can silently skip ticks) — exactly the
# failure mode this workflow exists to catch in the KEEPER. The honest fix is the same one
# keeper-cron.yml already uses: an external pinger (cron-job.org, free) hitting THIS
# workflow's `workflow_dispatch` REST endpoint on its own schedule, so the watchdog's own
# trigger doesn't depend on the thing it's least sure about. Not yet set up — needs a
# cron-job.org account action, which isn't something this session can do on its own.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  actions: read # to read the keeper workflow's run history
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Measure keeper cadence, alert on drift or total silence
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-1004486893356"
        run: node .github/scripts/keeper-cadence-check.mjs
