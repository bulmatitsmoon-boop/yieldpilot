name: Create Combined LP ALT (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install keeper deps
        working-directory: keeper
        run: npm ci

      - name: Write admin keypair from stored deploy-key secret (never leaves this runner)
        env:
          SOLANA_DEPLOY_KEY: ${{ secrets.SOLANA_DEPLOY_KEY }}
        run: |
          pip3 install --quiet base58
          python3 scripts/decode_deploy_key.py /tmp/admin.json

      - name: Create combined LP ALT
        working-directory: keeper
        env:
          RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          KEEPER_KEYPAIR_PATH: /tmp/admin.json
          IDL_PATH: src/idl/yieldpilot.mainnet.json
        run: npx ts-node src/scripts/create-combined-lp-alt.ts

      - name: Clean up keypair
        if: always()
        run: rm -f /tmp/admin.json
