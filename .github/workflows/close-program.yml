name: Close Mainnet Program

on:
  workflow_dispatch:
    inputs:
      program_id:
        description: 'Mainnet program address to close'
        required: true
      confirm:
        description: 'Type CONFIRM to actually close the mainnet program (irreversible — permanently burns the address)'
        required: true

jobs:
  close:
    runs-on: ubuntu-22.04
    steps:
      - name: Abort unless explicitly confirmed
        if: github.event.inputs.confirm != 'CONFIRM'
        run: |
          echo "Confirmation text did not match 'CONFIRM' — aborting."
          exit 1

      - uses: actions/checkout@v4

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Write admin authority keypair from secret JSON
        # Was SOLANA_DEPLOY_KEY (base58) -- that key was compromised 2026-09-03 and
        # never rotated after the real admin migrated to NEW_ADMIN_KEYPAIR_JSON
        # (verified live 2026-10-06 via a dedicated read-only check: SOLANA_DEPLOY_KEY
        # still decodes to the dead key, NEW_ADMIN_KEYPAIR_JSON decodes to the real
        # admin). Using the dead key here would just fail outright on-chain (the
        # program's upgrade authority check rejects it), not move funds -- but better
        # to not waste a CI cycle finding that out.
        env:
          NEW_ADMIN_KEYPAIR_JSON: ${{ secrets.NEW_ADMIN_KEYPAIR_JSON }}
        run: |
          echo "$NEW_ADMIN_KEYPAIR_JSON" > /tmp/deploy-authority.json

      - name: Close mainnet program
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          solana program close ${{ github.event.inputs.program_id }} \
            --keypair /tmp/deploy-authority.json \
            --url "${MAINNET_RPC_URL}" \
            --bypass-warning

      - name: Clean up keypair
        if: always()
        run: rm -f /tmp/deploy-authority.json
