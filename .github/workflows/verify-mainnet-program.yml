name: Verify Mainnet Program Build

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: 'Exact commit that was actually deployed to mainnet'
        required: true
        default: '71e9e2af8360d5dbbd5795a76ba0ac78c75d69ca'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-solana-verify-v1

      - name: Install solana-verify
        run: |
          if ! command -v solana-verify &> /dev/null; then
            cargo install solana-verify
          fi

      - name: Print solana-verify help (so we know the real current flags)
        run: |
          solana-verify verify-from-repo --help
          echo '---remote submit-job help---'
          solana-verify remote submit-job --help || true
          echo '---remote help---'
          solana-verify remote --help || true
