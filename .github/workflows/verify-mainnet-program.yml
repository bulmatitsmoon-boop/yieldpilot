name: Verify Mainnet Program Build
on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: 'Exact commit that was actually deployed to mainnet'
        required: true
        default: '4502f6e3766467f412065c927c0f77995075204e'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-solana-verify-v1

      - name: Install solana-verify
        run: |
          if ! command -v solana-verify &> /dev/null; then
            cargo install solana-verify
          fi

      - name: Install Node deps for the signing step
        run: npm install @solana/web3.js@1 bs58@5 --no-audit --no-fund

      - name: Write deploy authority keypair from base58 secret
        env:
          SOLANA_DEPLOY_KEY: ${{ secrets.SOLANA_DEPLOY_KEY }}
        run: |
          pip3 install --quiet base58
          python3 scripts/decode_deploy_key.py /tmp/deploy-authority.json

      # Deterministic docker build + hash comparison + generate the (unsigned) verify
      # PDA init transaction, all in one step so the blockhash inside it stays fresh
      # right up until we sign and submit it a few seconds later — no staleness gap
      # from a human needing to click "Run workflow" at an arbitrary later time.
      - name: Build and export verify PDA transaction
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          # solana-verify shells out to a plain `git clone` internally, which fails
          # silently-ish on a PRIVATE repo with no credentials (confirmed live
          # 2026-09-02: worked from a local machine with a cached git credential
          # helper, failed on a clean CI runner with none). The default
          # GITHUB_TOKEN (auto-scoped to this repo, auto-expires) embedded in the
          # clone URL fixes this without needing the long-lived PAT.
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
        run: |
          solana-verify export-pda-tx "${REPO_URL}" \
            --program-id 3tAEmHXZ51YVLe9ts8b9cMcgQPgaSamLxLtxR31VpREi \
            --uploader 8i7kydJHwi3Cdp46Xugyux2vWJmTScYDvnJrBiBihBnP \
            --commit-hash ${{ github.event.inputs.commit_hash }} \
            --library-name yieldpilot --mount-path programs/yieldpilot \
            -u "${MAINNET_RPC_URL}" \
            -- --features mainnet,no-idl \
            | tail -1 > /tmp/verify_tx_base58.txt
          echo "Transaction length: $(wc -c < /tmp/verify_tx_base58.txt)"

      - name: Sign and submit the verify PDA transaction
        env:
          RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          ADMIN_KEYPAIR_PATH: /tmp/deploy-authority.json
        run: |
          export VERIFY_TX_BASE58=$(cat /tmp/verify_tx_base58.txt)
          node scripts/tmp-submit-verify-pda-tx.js

      # Confirmed live 2026-09-03: calling this immediately after the init tx confirms
      # can fail with "The PDA associated with the given signer was not found" --
      # OtterSec's own backend hadn't indexed the just-created account within the same
      # second. The init transaction itself is genuinely done and durable at that
      # point (confirmed on-chain independently); this is purely a read-side
      # propagation race on their end. A short wait + a few retries clears it without
      # needing a whole separate manual re-run.
      - name: Queue the remote OtterSec verification worker
        run: |
          for i in 1 2 3 4 5; do
            sleep 10
            if solana-verify remote submit-job \
              --program-id 3tAEmHXZ51YVLe9ts8b9cMcgQPgaSamLxLtxR31VpREi \
              --uploader 8i7kydJHwi3Cdp46Xugyux2vWJmTScYDvnJrBiBihBnP; then
              echo "Queued successfully on attempt $i"
              break
            fi
            echo "Attempt $i failed, retrying..."
          done
      - name: Clean up keypair
        if: always()
        run: rm -f /tmp/deploy-authority.json /tmp/verify_tx_base58.txt
