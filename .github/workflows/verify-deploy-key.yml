name: Verify Deploy Key Pubkey (read-only, no fund movement)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Write deploy authority keypair from base58 secret
        env:
          SOLANA_DEPLOY_KEY: ${{ secrets.SOLANA_DEPLOY_KEY }}
        run: |
          pip3 install --quiet base58
          python3 scripts/decode_deploy_key.py /tmp/deploy-authority.json

      - name: Print and verify pubkey against the known-safe admin wallet
        run: |
          PUBKEY=$(solana-keygen pubkey /tmp/deploy-authority.json)
          echo "SOLANA_DEPLOY_KEY public key: $PUBKEY"
          EXPECTED="89J8qUmvq6HmkV3vKHcAayNgZEu5WFHq3LmiedBKaLCe"
          if [ "$PUBKEY" = "$EXPECTED" ]; then
            echo "MATCH: this is the safe admin wallet."
          else
            echo "MISMATCH! This key does NOT match the expected safe admin wallet ($EXPECTED)."
            echo "DO NOT use this key to sign anything until this is resolved."
            exit 1
          fi

      - name: Clean up keypair
        if: always()
        run: rm -f /tmp/deploy-authority.json
