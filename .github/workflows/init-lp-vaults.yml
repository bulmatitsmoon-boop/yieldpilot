name: Initialize New LP Vaults (Orca + Raydium)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CONFIRM to initialize both LP vaults on the new program (funds vault authorities with real SOL for position rent)'
        required: true

jobs:
  init:
    runs-on: ubuntu-22.04
    steps:
      - name: Abort unless explicitly confirmed
        if: github.event.inputs.confirm != 'CONFIRM'
        run: |
          echo "Confirmation text did not match 'CONFIRM' — aborting."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install keeper deps
        working-directory: keeper
        run: npm ci

      - name: Write admin authority keypair from base58 secret
        env:
          FRESH_ADMIN_KEYPAIR_JSON: ${{ secrets.FRESH_ADMIN_KEYPAIR_JSON }}
        run: |
          pip3 install --quiet base58
          python3 scripts/decode_base58_key.py FRESH_ADMIN_KEYPAIR_JSON /tmp/admin.json

      - name: Initialize Orca LP vault
        working-directory: keeper
        env:
          RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          KEEPER_KEYPAIR_PATH: /tmp/admin.json
          PROGRAM_ID: D9YJR8fvGLRSVfX82fpextgS9T7fT2QLm5Esnro6Yjmx
          IDL_PATH: ../idl/yieldpilot.mainnet.json
        run: npx ts-node src/scripts/init-orca-lp-vault.ts --keeper CRbCudvTiEnut2564zHk7PSt5em1JTngNPn7KnYMb1DS --treasury CiZb5cLMT6T8Spb4NspPCMgF5yNrZo5nxXimkJYPvnDA

      - name: Initialize Raydium LP vault
        working-directory: keeper
        env:
          RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          KEEPER_KEYPAIR_PATH: /tmp/admin.json
          PROGRAM_ID: D9YJR8fvGLRSVfX82fpextgS9T7fT2QLm5Esnro6Yjmx
          IDL_PATH: ../idl/yieldpilot.mainnet.json
          RAYDIUM_PROGRAM_ID: CAMMCzo5YL8w4VFF8KVHrK22GGUsp5VTaW7grrKgrWqK
        run: npx ts-node src/scripts/init-raydium-lp-vault.ts --keeper CRbCudvTiEnut2564zHk7PSt5em1JTngNPn7KnYMb1DS --treasury CiZb5cLMT6T8Spb4NspPCMgF5yNrZo5nxXimkJYPvnDA

      - name: Clean up keypair
        if: always()
        run: rm -f /tmp/admin.json
