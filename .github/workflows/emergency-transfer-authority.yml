name: EMERGENCY - Transfer Program Upgrade Authority
on:
  workflow_dispatch:
    inputs:
      new_authority:
        description: 'New upgrade authority public key'
        required: true

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Write deploy authority keypair from base58 secret (compromised key, used ONLY as --upgrade-authority signer)
        env:
          SOLANA_DEPLOY_KEY: ${{ secrets.SOLANA_DEPLOY_KEY }}
        run: |
          pip3 install --quiet base58
          python3 scripts/decode_deploy_key.py /tmp/deploy-authority.json

      - name: Write keeper keypair (used ONLY as fee payer -- admin wallet is drained, keeper still has real SOL)
        env:
          KEEPER_KEYPAIR_JSON: ${{ secrets.KEEPER_KEYPAIR_JSON }}
        run: |
          echo "$KEEPER_KEYPAIR_JSON" > /tmp/fee-payer.json

      - name: Transfer upgrade authority
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          solana config set --keypair /tmp/fee-payer.json --url "$MAINNET_RPC_URL"
          solana program set-upgrade-authority 3tAEmHXZ51YVLe9ts8b9cMcgQPgaSamLxLtxR31VpREi \
            --upgrade-authority /tmp/deploy-authority.json \
            --new-upgrade-authority "${{ github.event.inputs.new_authority }}" \
            --skip-new-upgrade-authority-signer-check

      - name: Clean up keypairs
        if: always()
        run: rm -f /tmp/deploy-authority.json /tmp/fee-payer.json
