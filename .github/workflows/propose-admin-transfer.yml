name: One-off - propose_admin transfer off compromised key
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install keeper deps
        working-directory: keeper
        run: npm install --no-audit --no-fund

      - name: Write deploy authority keypair from base58 secret (compromised key, used ONLY as admin signer to revoke its own power)
        env:
          SOLANA_DEPLOY_KEY: ${{ secrets.SOLANA_DEPLOY_KEY }}
        run: |
          pip3 install --quiet base58
          python3 scripts/decode_deploy_key.py /tmp/deploy-authority.json

      - name: Write keeper keypair (used ONLY as fee payer)
        env:
          KEEPER_KEYPAIR_JSON: ${{ secrets.KEEPER_KEYPAIR_JSON }}
        run: |
          echo "$KEEPER_KEYPAIR_JSON" > /tmp/fee-payer.json

      - name: Copy propose_admin script into keeper/
        run: cp scripts/propose_admin.js keeper/propose_admin.js

      - name: Run propose_admin on both vaults
        working-directory: keeper
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: node propose_admin.js

      - name: Clean up keypairs
        if: always()
        run: rm -f /tmp/deploy-authority.json /tmp/fee-payer.json
