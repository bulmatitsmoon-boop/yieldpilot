name: Test Whitelist Round 5

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: keeper/package-lock.json

      - name: Install dependencies
        working-directory: keeper
        run: npm ci

      - name: Write admin keypair from base58 secret
        working-directory: keeper
        env:
          SOLANA_DEPLOY_KEY: ${{ secrets.SOLANA_DEPLOY_KEY }}
        run: |
          pip3 install --quiet base58
          python3 ../scripts/decode_deploy_key.py admin.json

      - name: Test whitelist add/verify/remove
        working-directory: keeper
        run: npx ts-node src/scripts/test_whitelist.ts
        env:
          RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          ADMIN_KEYPAIR_PATH: ./admin.json
          PROGRAM_ID: CVJrJGoKjseTJqiFGctssYde3pLAnPaRZtjAaKXd8pWk

      - name: Clean up keypair
        if: always()
        working-directory: keeper
        run: rm -f admin.json
