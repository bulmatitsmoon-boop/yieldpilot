name: Hood LP Vault Keeper

# Runs maintain() on the LP vault. The CONTRACT decides whether a rebalance or compound is due and
# reverts with NothingToDo otherwise, so this is safe to run often. Only the keeper wallet may call it,
# and it cannot withdraw funds. Set repo variable LP_VAULT_ADDRESS after deploying; until then this no-ops.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: hood-lp-keeper
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run maintain() if the vault says it is due
        env:
          KEEPER_KEY: ${{ secrets.HOOD_KEEPER_KEY }}
          VAULT: ${{ vars.LP_VAULT_ADDRESS }}
        run: |
          set -u
          RPC=https://rpc.mainnet.chain.robinhood.com
          if [ -z "$KEEPER_KEY" ]; then echo "HOOD_KEEPER_KEY secret missing"; exit 1; fi
          KEEPER=$(cast wallet address --private-key "$KEEPER_KEY")
          echo "keeper wallet derived from HOOD_KEEPER_KEY: $KEEPER"
          if [ -z "$VAULT" ]; then echo "LP_VAULT_ADDRESS not set yet - nothing to do"; exit 0; fi

          # Loud failure (GitHub emails you) if the keeper is about to run out of gas.
          BAL=$(cast balance "$KEEPER" --rpc-url $RPC)
          echo "keeper $KEEPER balance (wei): $BAL"
          if [ "$BAL" -lt 200000000000000 ]; then echo "KEEPER LOW ON GAS - top up hood eth"; exit 1; fi

          NOTHING=$(cast sig 'NothingToDo()')
          DEVIATES=$(cast sig 'PriceDeviates()')
          set +e
          OUT=$(cast call "$VAULT" 'maintain()(uint8)' --from "$KEEPER" --rpc-url $RPC 2>&1)
          RC=$?
          set -e
          if [ $RC -eq 0 ]; then
            echo "maintain() would run (action code $OUT) - sending"
            cast send "$VAULT" 'maintain()' --private-key "$KEEPER_KEY" --rpc-url $RPC
          elif echo "$OUT" | grep -q "$NOTHING"; then
            echo "nothing due"
          elif echo "$OUT" | grep -q "$DEVIATES"; then
            echo "spot price is away from the 30 min average - skipping this run (by design)"
          else
            echo "UNEXPECTED revert from maintain(): $OUT"
            exit 1
          fi
