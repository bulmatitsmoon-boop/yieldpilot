name: Build Solana Program

on:
  push:
    branches: [main]
    paths:
      - 'programs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.86.0"

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-anchor-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Anchor CLI 0.31.0
        run: |
          if ! command -v anchor &> /dev/null; then
            cargo install anchor-cli --version 0.31.0 --locked
          fi

      - name: Anchor build (produces .so + IDL)
        run: anchor build

      - name: Sync IDL to app and keeper
        run: |
          cp target/idl/yieldpilot.json app/src/idl/yieldpilot.json
          cp target/idl/yieldpilot.json keeper/src/idl/yieldpilot.json

      - name: Commit updated IDL
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: sync IDL from anchor build [skip ci]'
          file_pattern: 'app/src/idl/yieldpilot.json keeper/src/idl/yieldpilot.json'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yieldpilot-so
          path: target/deploy/yieldpilot.so
          retention-days: 7

      - name: Write deploy authority keypair from base58 secret
        env:
          SOLANA_DEPLOY_KEY: ${{ secrets.SOLANA_DEPLOY_KEY }}
        run: |
          pip3 install --quiet base58
          python3 scripts/decode_deploy_key.py /tmp/deploy-authority.json

      - name: Deploy to devnet
        env:
          DEVNET_RPC_URL: ${{ secrets.DEVNET_RPC_URL }}
        run: |
          solana program deploy --program-id 8c7Boyk91MWkn5jabf5CnYD8DrG6p4hYm9eDdAAWXEKH --keypair /tmp/deploy-authority.json --url "${DEVNET_RPC_URL}" target/deploy/yieldpilot.so

      - name: Clean up keypair
        if: always()
        run: rm -f /tmp/deploy-authority.json
