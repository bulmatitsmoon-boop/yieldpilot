name: Build Solana Program

on:
  push:
    branches: [main]
    paths:
      - 'programs/**'
  pull_request:
    branches: [main]
    paths:
      - 'programs/**'
  workflow_dispatch:
    inputs:
      network:
        description: 'Network to deploy to'
        required: true
        default: 'devnet'
        type: choice
        options:
          - devnet
          - mainnet

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.86.0"

      - name: Force rustup default to 1.86.0
        run: |
          rustup default 1.86.0
          rustc --version
          cargo --version

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.0.3/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-anchor-v2-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Anchor CLI 0.31.0
        run: |
          cargo --version
          if ! command -v anchor &> /dev/null; then
            cargo +1.86.0 install anchor-cli --version 0.31.0 --locked
          fi

      - name: Build program binary (does NOT touch program id / keys)
        run: |
          cd programs/yieldpilot
          if [ "${{ github.event.inputs.network }}" == "mainnet" ]; then
            cargo-build-sbf --manifest-path Cargo.toml --features mainnet,no-idl
          else
            cargo-build-sbf --manifest-path Cargo.toml --features no-idl
          fi

      - name: Generate IDL only (does NOT touch program id / keys)
        run: |
          mkdir -p target/idl
          if [ "${{ github.event.inputs.network }}" == "mainnet" ]; then
            anchor idl build -o target/idl/yieldpilot.json -- --features mainnet
          else
            anchor idl build -o target/idl/yieldpilot.json
          fi

      - name: Sync IDL to app and keeper (devnet)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.network == 'devnet')
        run: |
          cp target/idl/yieldpilot.json app/src/idl/yieldpilot.json
          cp target/idl/yieldpilot.json keeper/src/idl/yieldpilot.json

      - name: Sync IDL to app and keeper (mainnet)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.network == 'mainnet'
        run: |
          cp target/idl/yieldpilot.json app/src/idl/yieldpilot.mainnet.json
          cp target/idl/yieldpilot.json keeper/src/idl/yieldpilot.mainnet.json

      - name: Commit updated IDL (devnet)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.network == 'devnet')
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: sync IDL from anchor idl build [skip ci]'
          file_pattern: 'app/src/idl/yieldpilot.json keeper/src/idl/yieldpilot.json'

      - name: Commit updated IDL (mainnet)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.network == 'mainnet'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: sync mainnet IDL from anchor idl build [skip ci]'
          file_pattern: 'app/src/idl/yieldpilot.mainnet.json keeper/src/idl/yieldpilot.mainnet.json'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yieldpilot-so-${{ github.event.inputs.network || 'devnet' }}
          path: |
            target/deploy/yieldpilot.so
            target/idl/yieldpilot.json
          retention-days: 7

      - name: Write deploy authority keypair from base58 secret
        # Only materialise the deploy key when actually deploying (push to main or a
        # workflow_dispatch). On pull_request there is nothing to deploy, so the key
        # should never touch disk. GitHub already withholds secrets from fork PRs, but
        # gating the step removes it from collaborator-PR runs too. Defense in depth.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          SOLANA_DEPLOY_KEY: ${{ secrets.SOLANA_DEPLOY_KEY }}
        run: |
          pip3 install --quiet base58
          python3 scripts/decode_deploy_key.py /tmp/deploy-authority.json

      - name: Deploy to devnet
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.network == 'devnet')
        env:
          DEVNET_RPC_URL: ${{ secrets.DEVNET_RPC_URL }}
        run: |
          solana program deploy --program-id 8c7Boyk91MWkn5jabf5CnYD8DrG6p4hYm9eDdAAWXEKH --keypair /tmp/deploy-authority.json --url "${DEVNET_RPC_URL}" target/deploy/yieldpilot.so

      - name: Write mainnet program keypair from base58 secret
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.network == 'mainnet'
        env:
          MAINNET_PROGRAM_KEYPAIR: ${{ secrets.MAINNET_PROGRAM_KEYPAIR }}
        run: |
          pip3 install --quiet base58
          python3 scripts/decode_mainnet_program_key.py /tmp/mainnet-program-keypair.json

      # Solana's BPFLoaderUpgradeable can only extend a program account in minimum
      # 10240-byte chunks (ExtendProgram's own floor) — `solana program deploy`'s
      # auto-extend does NOT know this and just requests exactly (new_size - current_size)
      # bytes, which fails outright ("invalid program argument") whenever that gap is
      # small (observed live 2026-08-05: a 48-byte gap failed deploy entirely, no funds
      # lost since the failure happens before the buffer/extend actually commits, but it
      # wastes a full CI cycle every time the binary crosses its allocated capacity by a
      # small amount). Pre-extending in one guaranteed-large-enough step makes the
      # subsequent deploy always a same-size upgrade (never needs its own extend), so
      # this failure mode can't recur regardless of how small the future overage is.
      - name: Extend mainnet program account if needed (works around Solana's 10240-byte minimum extend)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.network == 'mainnet'
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          CURRENT_LEN=$(solana program show 3tAEmHXZ51YVLe9ts8b9cMcgQPgaSamLxLtxR31VpREi --url "${MAINNET_RPC_URL}" | awk -F'[ (]' '/Data Length:/{print $3}')
          NEW_LEN=$(stat -c%s target/deploy/yieldpilot.so)
          echo "current on-chain capacity: $CURRENT_LEN bytes, new binary: $NEW_LEN bytes"
          if [ "$NEW_LEN" -gt "$CURRENT_LEN" ]; then
            EXTEND_BY=$(( NEW_LEN - CURRENT_LEN > 10240 ? NEW_LEN - CURRENT_LEN : 10240 ))
            echo "extending program account by $EXTEND_BY bytes first"
            solana program extend 3tAEmHXZ51YVLe9ts8b9cMcgQPgaSamLxLtxR31VpREi "$EXTEND_BY" --keypair /tmp/deploy-authority.json --url "${MAINNET_RPC_URL}"
          else
            echo "binary fits in current capacity, no extend needed"
          fi

      - name: Deploy to mainnet
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.network == 'mainnet'
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          solana program deploy --program-id /tmp/mainnet-program-keypair.json --upgrade-authority /tmp/deploy-authority.json --keypair /tmp/deploy-authority.json --url "${MAINNET_RPC_URL}" target/deploy/yieldpilot.so

      - name: Clean up keypairs
        if: always()
        run: rm -f /tmp/deploy-authority.json /tmp/mainnet-program-keypair.json

