name: One-off - refund keeper wallet from new admin key
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refund:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        working-directory: keeper
        run: npm install --no-audit --no-fund
      - name: Write admin keypair
        env:
          NEW_ADMIN_KEYPAIR_JSON: ${{ secrets.NEW_ADMIN_KEYPAIR_JSON }}
        run: echo "$NEW_ADMIN_KEYPAIR_JSON" > /tmp/admin-keypair.json
      - name: Run refund script
        working-directory: keeper
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          cp ../scripts/refund_keeper_ci.js .
          node refund_keeper_ci.js
      - name: Clean up
        if: always()
        run: rm -f /tmp/admin-keypair.json
