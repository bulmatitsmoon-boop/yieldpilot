name: Init Mainnet LP Vaults (one-off)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no transactions sent)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  init:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install keeper deps
        working-directory: keeper
        run: npm ci

      - name: Write admin keypair from stored deploy-key secret (never leaves this runner)
        env:
          SOLANA_DEPLOY_KEY: ${{ secrets.SOLANA_DEPLOY_KEY }}
        run: |
          pip3 install --quiet base58
          python3 scripts/decode_deploy_key.py /tmp/admin.json

      - name: Init Orca LP vault (mainnet)
        working-directory: keeper
        env:
          RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          PROGRAM_ID: 3tAEmHXZ51YVLe9ts8b9cMcgQPgaSamLxLtxR31VpREi
          IDL_PATH: ../idl/yieldpilot.mainnet.json
          KEEPER_KEYPAIR_PATH: /tmp/admin.json
        run: |
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            npx ts-node src/scripts/init-orca-lp-vault.ts --dry-run
          else
            npx ts-node src/scripts/init-orca-lp-vault.ts
          fi

      - name: Init Raydium LP vault (mainnet)
        working-directory: keeper
        env:
          RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          PROGRAM_ID: 3tAEmHXZ51YVLe9ts8b9cMcgQPgaSamLxLtxR31VpREi
          IDL_PATH: ../idl/yieldpilot.mainnet.json
          KEEPER_KEYPAIR_PATH: /tmp/admin.json
          RAYDIUM_PROGRAM_ID: CAMMCzo5YL8w4VFF8KVHrK22GGUsp5VTaW7grrKgrWqK
        run: |
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            npx ts-node src/scripts/init-raydium-lp-vault.ts --dry-run
          else
            npx ts-node src/scripts/init-raydium-lp-vault.ts
          fi

      - name: Clean up keypair
        if: always()
        run: rm -f /tmp/admin.json
