name: Test Solend Deposit Retry

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: keeper/package-lock.json

      - name: Install dependencies
        working-directory: keeper
        run: npm ci

      - name: Write keeper keypair from JSON secret
        working-directory: keeper
        env:
          KEEPER_KEYPAIR_JSON: ${{ secrets.KEEPER_KEYPAIR_JSON }}
        run: echo "$KEEPER_KEYPAIR_JSON" > keeper.json

      - name: Retry Solend deposit (tiny amount, raw error capture)
        working-directory: keeper
        run: npx ts-node src/scripts/test_solend_deposit_retry.ts
        env:
          RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          KEEPER_KEYPAIR_PATH: ./keeper.json
          PROGRAM_ID: CVJrJGoKjseTJqiFGctssYde3pLAnPaRZtjAaKXd8pWk

      - name: Clean up keypair
        if: always()
        working-directory: keeper
        run: rm -f keeper.json
