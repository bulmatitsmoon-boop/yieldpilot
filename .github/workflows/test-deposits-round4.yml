name: Test Deposits Round 4

on:
  workflow_dispatch: {}

jobs:
  deposit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: keeper/package-lock.json

      - name: Install dependencies
        working-directory: keeper
        run: npm ci

      - name: Write admin keypair from base58 secret
        working-directory: keeper
        env:
          SOLANA_DEPLOY_KEY: ${{ secrets.SOLANA_DEPLOY_KEY }}
        run: |
          pip3 install --quiet base58
          python3 ../scripts/decode_deploy_key.py admin.json

      - name: Deposit 5 USDC
        working-directory: keeper
        run: npx ts-node src/scripts/test_deposit.ts --type usdc --amount 5000000
        env:
          RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          KEEPER_KEYPAIR_PATH: ./admin.json
          PROGRAM_ID: CNsmezyyy3VpoUDcARbmES2wHyCXPNHTGahjLAE4iEhq
          IDL_PATH: ../idl/yieldpilot.mainnet.json

      - name: Deposit 0.03 SOL
        working-directory: keeper
        run: npx ts-node src/scripts/test_deposit_sol.ts --amount 30000000
        env:
          RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          KEEPER_KEYPAIR_PATH: ./admin.json
          PROGRAM_ID: CNsmezyyy3VpoUDcARbmES2wHyCXPNHTGahjLAE4iEhq
          IDL_PATH: ../idl/yieldpilot.mainnet.json

      - name: Clean up keypair
        if: always()
        working-directory: keeper
        run: rm -f admin.json
