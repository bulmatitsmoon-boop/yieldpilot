# Typecheck the keeper on every change to it.
#
# WHY THIS EXISTS: the keeper is the only component that moves real funds, and it runs
# unattended on a 45-minute cron. keeper-cron.yml executes `npx ts-node src/run_once.ts`,
# and ts-node typechecks at startup — so a type error here does NOT fail some harmless
# build, it takes the LIVE KEEPER DOWN until a human happens to notice. Nothing else in CI
# compiles this package: Vercel only builds app/, and build.yml only builds the Rust program.
#
# Added 2026-07-17 after two real type errors reached review-ready state in the same day and
# were caught only by running `tsc --noEmit` by hand: a rebalancer change referenced
# `p.protocolId` and `p.targetAllocationBps`, neither of which exists on
# `VaultState.protocols[]` (the real fields are `p.label` and `p.targetBps`).
#
# tsconfig.json has "include": ["src/**/*"], so this also covers src/scripts/* — the one-off
# money-moving scripts (deposit / recall / withdraw) that nothing else ever exercises.
#
# Node 20 + the npm cache key mirror keeper-cron.yml deliberately: typecheck against the same
# runtime that actually executes, or this can pass while the cron still breaks.
name: Keeper CI

on:
  pull_request:
    paths:
      - "keeper/**"
      - "tests/verify-epoch-cooldown.mjs"
      - ".github/workflows/keeper-ci.yml"
  push:
    branches: [main]
    paths:
      - "keeper/**"
      - "tests/verify-epoch-cooldown.mjs"
      - ".github/workflows/keeper-ci.yml"

jobs:
  typecheck:
    name: typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: keeper/package-lock.json

      - name: Install dependencies
        working-directory: keeper
        run: npm ci

      - name: Typecheck
        working-directory: keeper
        run: npx tsc --noEmit

  # Typechecking alone would NOT have caught the 2026-08-20 churn incident: the
  # fail-open epoch cooldown was perfectly well-typed and silently inert, and it cost
  # ~77% of two weeks' yield in avoidable exit fees. This asserts the behaviour.
  epoch-cooldown:
    name: epoch-cooldown gate (fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tests/verify-epoch-cooldown.mjs
