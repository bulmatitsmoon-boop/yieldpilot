name: Initialize New Safe Vaults (USDC + SOL)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CONFIRM to initialize both Safe vaults on the new program'
        required: true

jobs:
  init:
    runs-on: ubuntu-22.04
    steps:
      - name: Abort unless explicitly confirmed
        if: github.event.inputs.confirm != 'CONFIRM'
        run: |
          echo "Confirmation text did not match 'CONFIRM' — aborting."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Write admin authority keypair from secret JSON
        env:
          NEW_ADMIN_KEYPAIR_JSON: ${{ secrets.NEW_ADMIN_KEYPAIR_JSON }}
        run: |
          echo "$NEW_ADMIN_KEYPAIR_JSON" > /tmp/admin.json

      - name: Initialize vaults
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: node scripts/init_new_vaults.js /tmp/admin.json

      - name: Clean up keypair
        if: always()
        run: rm -f /tmp/admin.json
