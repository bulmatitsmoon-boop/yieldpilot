name: Init Round 5 Vaults

on:
  workflow_dispatch: {}

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: keeper/package-lock.json

      - name: Install dependencies
        working-directory: keeper
        run: npm ci

      - name: Write admin keypair from base58 secret
        working-directory: keeper
        env:
          SOLANA_DEPLOY_KEY: ${{ secrets.SOLANA_DEPLOY_KEY }}
        run: |
          pip3 install --quiet base58
          python3 ../scripts/decode_deploy_key.py admin.json

      - name: Init USDC vault
        working-directory: keeper
        run: npx ts-node src/scripts/init-vault.ts --type usdc --keeper DzBe4ag5Ehjd3eE3wa5JVnqcVM2mQ8FFd2ZmxKjVvY2M
        env:
          RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          KEEPER_KEYPAIR_PATH: ./admin.json
          PROGRAM_ID: CVJrJGoKjseTJqiFGctssYde3pLAnPaRZtjAaKXd8pWk
          IDL_PATH: ../idl/yieldpilot.mainnet.json

      - name: Init SOL vault
        working-directory: keeper
        run: npx ts-node src/scripts/init-vault.ts --type sol --keeper DzBe4ag5Ehjd3eE3wa5JVnqcVM2mQ8FFd2ZmxKjVvY2M
        env:
          RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          KEEPER_KEYPAIR_PATH: ./admin.json
          PROGRAM_ID: CVJrJGoKjseTJqiFGctssYde3pLAnPaRZtjAaKXd8pWk
          IDL_PATH: ../idl/yieldpilot.mainnet.json

      - name: Clean up keypair
        if: always()
        working-directory: keeper
        run: rm -f admin.json
