name: Hood Withdraw All (fee-free)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm this runs REAL signed mainnet transactions'
        required: true
        default: 'no'

jobs:
  run-real-withdraw-all:
    if: github.event.inputs.confirm == 'yes'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hood-chain
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge-std (pinned commit)
        run: forge install foundry-rs/forge-std@7fdf81f9ceb2f6ebbb8f9f1c6c5274d5bcc9a1f5 --no-commit

      - name: Build
        run: forge build

      - name: Run RealWithdrawAllFeeFree.s.sol against Robinhood Chain mainnet
        env:
          HOOD_ADMIN_KEY: ${{ secrets.HOOD_ADMIN_KEY }}
        run: |
          forge script script/RealWithdrawAllFeeFree.s.sol             --rpc-url https://rpc.mainnet.chain.robinhood.com             --private-key "$HOOD_ADMIN_KEY"             --broadcast
