name: One-off - fund new admin key with a small amount for fees
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fund:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install keeper deps
        working-directory: keeper
        run: npm install --no-audit --no-fund
      - name: Write keeper keypair
        env:
          KEEPER_KEYPAIR_JSON: ${{ secrets.KEEPER_KEYPAIR_JSON }}
        run: echo "$KEEPER_KEYPAIR_JSON" > /tmp/fee-payer.json
      - name: Copy and run funding script
        working-directory: keeper
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          cp ../scripts/fund_new_admin.js .
          node fund_new_admin.js
      - name: Clean up
        if: always()
        run: rm -f /tmp/fee-payer.json
