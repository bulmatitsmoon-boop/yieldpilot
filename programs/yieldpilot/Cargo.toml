[package]
name = "yieldpilot"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "yieldpilot"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
anchor-lang  = { version = "=0.31.0", features = ["init-if-needed"] }
anchor-spl   = { version = "=0.31.0", features = ["token", "associated_token"] }
# Pin to pre-edition2024 / Rust-1.79-compatible versions
blake3       = "=1.5.4"
cpufeatures  = "=0.2.11"
hashbrown    = "=0.14.5"
indexmap     = "=2.3.0"
zeroize      = "=1.7.0"
